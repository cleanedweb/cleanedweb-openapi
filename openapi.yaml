components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An account API key. Keep it on your server. Send it only to the API origin. Scopes: `read`, `run`,
        `results`; each operation lists what opens it in `x-scopes-any-of`.
  parameters:
    ApiId:
      name: api_id
      in: path
      required: true
      description: The API's `api_id` from the list.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      description: The endpoint's `endpoint_id` from the API.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
    RunId:
      name: run_id
      in: path
      required: true
      description: 32 lowercase hexadecimal characters.
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
    SourceId:
      name: source_id
      in: path
      required: true
      description: The identifier of one of your source APIs, from its connection details.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      description: 32 lowercase hexadecimal characters.
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required. A key you generate and save before you send. Reuse it only to recover the same request, and read
        the result with the same key. Missing or invalid answers `422` `idempotency_key_required`.
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Where the page starts. Offset paging reflects current content and is not a snapshot.
      schema:
        type: integer
        minimum: 0
        default: 0
    Query:
      name: q
      in: query
      required: false
      description: Searches the published inventory before paging.
      schema:
        type: string
        maxLength: 200
    Category:
      name: category
      in: query
      required: false
      description: Only APIs in this category.
      schema:
        $ref: '#/components/schemas/Category'
    Sort:
      name: sort
      in: query
      required: false
      description: Most recently updated first, or by name.
      schema:
        type: string
        enum: [updated, name]
        default: updated
    ContractVersion:
      name: version
      in: query
      required: false
      description: |
        Read the contract of this major (an integer of at least 1) instead of the latest. An unknown major answers
        `404` `catalog_version_not_found` with the majors that exist; a value that is not a whole number of at
        least 1 answers `422` `catalog_version_invalid`.
      schema:
        type: integer
        minimum: 1
    Nulls:
      name: nulls
      in: query
      required: false
      description: '`true` sends every published field, with absent values as `null`. Any other value answers `422` `run_nulls_invalid`.'
      schema:
        type: string
        enum: ['true', 'false']
        default: 'false'
  headers:
    Location:
      description: Where to read the run or schedule. Relative to the origin that answered (`/v1/runs/{run_id}`).
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before reading the result again. `30` on a run still going.
      schema:
        type: integer
    IdempotentReplayed:
      description: '`true` when the key already named this run or schedule.'
      schema:
        type: string
        enum: ['true']
    CacheControl:
      description: '`no-store`.'
      schema:
        type: string
    XRunStatus:
      description: The run's status.
      schema:
        $ref: '#/components/schemas/RunStatus'
    XNextCursor:
      description: The cursor to continue with, present while more records can follow.
      schema:
        type: string
    Deprecation:
      description: |
        Present when the major you pinned is deprecated, or was sunset and the call was rerouted. `@` and the Unix
        epoch seconds (UTC) at which the major was deprecated (RFC 9745).
      schema:
        type: string
        pattern: '^@[0-9]+$'
    Sunset:
      description: When the major stops answering, as an HTTP date. Left out when it has no sunset date.
      schema:
        type: string
    Link:
      description: 'The listing''s changelog: `<https://cleanedweb.com/catalog/API_ID#changelog>; rel="deprecation"`.'
      schema:
        type: string
  responses:
    RunAccepted:
      description: |
        The run is queued or still running. Not an error. Do not send the POST again: read the result after
        `Retry-After` seconds.
      headers:
        Location:
          $ref: '#/components/headers/Location'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Run'
          example:
            run_id: 0123456789abcdef0123456789abcdef
            surface: rest_run
            source_id: generated_047a8ebb25911ccf62f4a212_search
            definition_version: eec683b95f337dcc63a3fb5bf1e23729fb71f6f719f51ea771c19345b5893252
            status: running
            stop_reason: null
            created_at: '2026-11-20T05:30:00+00:00'
            started_at: '2026-11-20T05:30:01+00:00'
            finished_at: null
            limits:
              max_items: 25
              timeout_seconds: 3600
            progress:
              pages: 1
              commits: 1
              items: 20
              duplicates: 0
            units_charged: 20
            abort_requested: false
            poll_after_seconds: 30
            links:
              self: /v1/runs/0123456789abcdef0123456789abcdef
              items: /v1/runs/0123456789abcdef0123456789abcdef/items
              result: /v1/runs/0123456789abcdef0123456789abcdef/result
              abort: /v1/runs/0123456789abcdef0123456789abcdef/abort
    Unauthorized:
      description: No credential, or a key that is invalid, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Unauthorized
    Forbidden:
      description: |
        The key lacks the scope or the access, or is not tied to a workspace account. Typical details are
        `Credential scope does not allow this operation` and `workspace_billing_identity_invalid`. A malformed
        `run_id` or `schedule_id` (not 32 lowercase hex characters) also answers `403`, with
        `Customer credential cannot access this route`: the id does not match any route a customer key may use
        (`FINDINGS.md`, finding 14).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        The API, endpoint, run, schedule or delivery was not found or is not accessible to the key. Codes include
        `catalog_not_found`, `catalog_delivery_not_found`, `schedule_not_found` and `catalog_version_not_found`
        (with `available`, the majors that exist).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail:
              code: catalog_version_not_found
              message: This API has no such version. The available versions are listed.
              available: [1, 2]
    PaymentRequired:
      description: '`insufficient_units`: the balance cannot fund the run. `detail.required` and `detail.available` are decimal strings. Add credit, then send a new key if the run failed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail:
              code: insufficient_units
              message: The workspace does not have enough Units for this request. Nothing was charged. Add Units in Billing and try again.
              required: '25'
              available: '3'
    Conflict:
      description: |
        `usage_budget_exceeded`, `delivery_identity_conflict` (the key was reused for another request, endpoint
        or version), `builder_definition_version_conflict` (the active definition differs from `expected_version`),
        `result_not_available`, `result_not_complete` or `result_not_running` (with `Retry-After`; retry the same
        key), `schedule_idempotency_conflict`, `schedule_not_paused` and `schedule_limit_reached`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail:
              code: delivery_identity_conflict
              message: That Idempotency-Key was already used for a different request or API version. Use a new key.
    UnprocessableEntity:
      description: |
        An input or run option the contract does not accept, or an invalid query. `detail` is an object with a
        `code` (`run_option_invalid`, `idempotency_key_required`, `invalid_catalog_query`, `catalog_version_invalid`,
        `run_fields_invalid`, `run_list_query_invalid`, `run_items_query_invalid`, ...) or, for a plain FastAPI
        validation failure, a list of issues. An input the source refuses (for example an unknown input field) is
        different: the run is created and fails, so `detail` is the failed-run marker (`error_code: run_failed`,
        `run_id`, `retryable: false`) with `classification: source_input_invalid`, `reason: input_invalid` and the
        failed `constraint`, and the answer carries a `Location` header. Nothing is charged (`FINDINGS.md`,
        finding 13).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail:
              code: run_option_invalid
              option: max_items
              minimum: 1
              maximum: 1000000000000
    RateLimited:
      description: |
        `engine_request_limited`: the request limit of the key's workspace was reached. `Retry-After` and
        `detail.retry_after_seconds` say how long to wait. Retry with the same key.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail:
              code: engine_request_limited
              message: Request limit exceeded
              retry_after_seconds: 12
    BadGateway:
      description: A gateway or upstream failure. Without a failed-run marker the run may have started; keep the key and read the result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeout:
      description: A gateway timeout. Without a failed-run marker the run may have started; keep the key and read the result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: |
        Billing could not be confirmed (`builder_billing_unavailable`), run storage did not answer (`runs_unavailable`),
        or execution is unavailable. Retry later with the same key. A `503` is never an empty result set. A failed run
        can also answer `5xx` with the failed-run marker: that is final.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9._:-]+$'
      examples:
        - 72ad1b16-20ad-4ef4-a578-d8b893601d7e
    Category:
      type: string
      enum:
        - commerce
        - real_estate
        - jobs
        - businesses_places
        - news_content
        - social_communities
        - travel
        - public_data
        - web_search
        - uncategorized
    RunStatus:
      type: string
      enum: [queued, running, finished, failed, aborted]
    Error:
      type: object
      description: Every error carries `detail`.
      properties:
        detail:
          $ref: '#/components/schemas/ErrorDetail'
      required: [detail]
    ErrorDetail:
      description: A string, an object with a `code`, or a list of validation issues.
      oneOf:
        - type: string
        - $ref: '#/components/schemas/ErrorObject'
        - type: array
          items:
            type: object
            additionalProperties: true
    ErrorObject:
      type: object
      additionalProperties: true
      properties:
        code:
          type: string
          description: For example `insufficient_units`, `usage_budget_exceeded`, `delivery_identity_conflict`, `run_option_invalid`, `engine_request_limited`, `catalog_version_not_found`.
        message:
          type: string
        classification:
          type: string
          description: On a source execution error.
        retryable:
          type: boolean
          description: On a source execution error.
        traceId:
          type: string
        retryAfterSeconds:
          type: number
          description: On a source execution error. The `Retry-After` header carries the same wait.
        retry_after_seconds:
          type: number
          description: On `engine_request_limited`.
        run_id:
          type: string
          description: The failed run, when the error is a failed run's.
        error_code:
          type: string
          enum: [run_failed, failed_run_replayed]
          description: Marks a failed run. `failed_run_replayed` answers a replay of the same key (resending the request or reading the result).
        replayed:
          type: boolean
          description: Whether this answer replays the key. Present beside `error_code`.
        required:
          type: string
          description: Units the run needs, on `insufficient_units` (a decimal string).
        available:
          description: On `insufficient_units`, the Units the balance has (a decimal string). On `catalog_version_not_found`, the majors that exist, oldest first.
          oneOf:
            - type: string
            - type: array
              items:
                type: integer
        version:
          type: string
          description: The major that failed, on a pinned call.
        version_requested:
          type: integer
        rerouted:
          type: string
          enum: [sunset]
    CatalogSite:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        description:
          type: string
        icon_url:
          type: [string, 'null']
      required: [name, domain]
    CatalogEndpointSummary:
      type: object
      properties:
        endpoint_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          description: '`available` when you can run it.'
        acquisition:
          type: string
        active_version:
          type: string
          description: The 64-character definition version a run uses. Only on a single API's answer.
        version:
          type: string
          description: The newest minor of the latest major, for example `1.1`. Only on a listing that has versions.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionRow'
        changelog:
          type: array
          items:
            $ref: '#/components/schemas/ChangelogEntry'
      required: [endpoint_id, name, status]
    CatalogReliability:
      type: object
      description: Run outcome counts for the last `window_days` days.
      properties:
        window_days:
          type: integer
        runs:
          type: integer
        succeeded:
          type: integer
        last_run_at:
          type: [number, 'null']
    CatalogApi:
      type: object
      properties:
        api_id:
          type: string
        name:
          type: string
        short_description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        record_types:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
          description: Empty means the coverage is unspecified, not worldwide.
        languages:
          type: array
          items:
            type: string
          description: Empty means the coverage is unspecified.
        tags:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
          description: Read these before you rely on an API for a whole site.
        visibility:
          type: string
        api_type:
          type: string
        site:
          $ref: '#/components/schemas/CatalogSite'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEndpointSummary'
        acquisition:
          type: string
        updated_at:
          type: number
          description: Unix epoch seconds (UTC).
        health:
          type: string
          description: '`unknown` until a health contract reports evidence.'
        last_verified_at:
          type: [number, 'null']
        reliability:
          $ref: '#/components/schemas/CatalogReliability'
      required: [api_id, name, short_description, category, site, endpoints]
    CatalogApiList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogApi'
      required: [items]
    VersionRow:
      type: object
      properties:
        major:
          type: integer
          minimum: 1
        latest_minor:
          type: string
        status:
          type: string
          enum: [current, deprecated, sunset]
        sunset_at:
          type: [string, 'null']
      required: [major, status]
    ChangelogEntry:
      type: object
      additionalProperties: true
      properties:
        version:
          type: string
        date:
          type: string
        kind:
          type: string
          description: '`major` for a new major; otherwise `minor`.'
        changes:
          type: array
          items:
            type: object
            additionalProperties: true
    SavedExample:
      type: object
      properties:
        kind:
          type: string
        definition_version:
          type: string
        saved_at:
          type: number
          description: When the sample was saved, Unix epoch seconds (UTC). It is not the time of your next run.
        request:
          type: object
          additionalProperties: true
        records:
          type: array
          items:
            type: object
            additionalProperties: true
        live_verified:
          type: boolean
    Contract:
      type: object
      description: The contract of one endpoint, generated from the saved definition that runs.
      properties:
        endpoint_id:
          type: string
        definition_version:
          type: string
          description: The immutable 64-character version a run uses. You select a major with `version`, not this.
        updated_at:
          type: number
        method:
          type: string
          enum: [POST]
        path:
          type: string
          description: The run request path. Send it to the API origin.
        operation_type:
          type: string
        acquisition:
          type: string
        input_schema:
          type: object
          description: JSON Schema for `input`. Its `required` array lists the inputs you must send.
          additionalProperties: true
        output_schema:
          type: object
          description: JSON Schema for each record.
          additionalProperties: true
        parameters:
          type: array
          items:
            type: object
            additionalProperties: true
        examples:
          type: array
          items:
            $ref: '#/components/schemas/SavedExample'
        authentication:
          type: string
        limits:
          description: Build-time metadata, not the bounds of a run.
        pagination:
          description: Build-time metadata. Can be null.
        billing:
          description: Can be null.
        api_origin:
          type: string
          description: Only on the console origin's contract. The origin to send runs to.
        version:
          type: string
          description: The major and its newest minor, for example `2.3`. Only on a listing that has versions.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionRow'
        changelog:
          type: array
          items:
            $ref: '#/components/schemas/ChangelogEntry'
        version_requested:
          type: integer
        rerouted:
          type: string
          enum: [sunset]
      required: [endpoint_id, definition_version, method, path, input_schema, output_schema]
    CatalogIndex:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
        count:
          type: integer
        updated:
          type: string
        live:
          description: The live list address.
        links:
          type: object
          additionalProperties: true
        sites:
          type: array
          items:
            type: object
            additionalProperties: true
        apis:
          type: array
          items:
            $ref: '#/components/schemas/CatalogIndexEntry'
      required: [apis]
    CatalogIndexEntry:
      type: object
      properties:
        name:
          type: string
        api_id:
          type: string
        slug:
          type: string
        url:
          type: string
        description:
          type: string
        source:
          type: object
          additionalProperties: true
        category:
          type: string
        key_fields:
          type: array
          items:
            type: string
        updated:
          type: string
        markdown:
          type: string
        contract:
          type: string
        endpoints:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              endpoint_id:
                type: string
              name:
                type: string
              major:
                type: integer
              run:
                type: string
                description: The full run URL, on the API origin.
      required: [api_id, slug]
    ListingContract:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        api_id:
          type: string
        slug:
          type: string
        source:
          type: object
          additionalProperties: true
        category:
          type: string
        limitations:
          type: array
          items:
            type: string
        version:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionRow'
        endpoints:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              endpoint_id:
                type: string
              definition_version:
                type: string
              method:
                type: string
              path:
                type: string
              url:
                type: string
                description: The full run URL, on the API origin.
              input_schema:
                type: object
                additionalProperties: true
              output_schema:
                type: object
                additionalProperties: true
        links:
          type: object
          additionalProperties: true
      required: [api_id, endpoints]
    RunOptions:
      type: object
      description: Options common to every run request.
      properties:
        max_items:
          type: integer
          minimum: 1
          description: Stop after this many de-duplicated records.
        timeout_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 10800
          description: 'The run''s own time budget, counted from when it starts running. Part of the request identity: changing it with the same key answers `409` `delivery_identity_conflict`.'
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 90
          description: How long this request waits for the run to end before answering `202`. It does not change the run and is not part of the request identity.
        fields:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
          description: Return only these published output fields; required and identity fields are always kept.
        nulls:
          type: boolean
          default: false
          description: Send every published field, with absent values as `null`. Not part of the request identity.
    CatalogRunRequest:
      description: Only the listed fields are accepted; any other field is rejected.
      allOf:
        - $ref: '#/components/schemas/RunOptions'
        - type: object
          properties:
            input:
              type: object
              additionalProperties: true
              description: The inputs from the contract. Unknown inputs are rejected.
            version:
              type: integer
              minimum: 1
              description: The major to run. Leave it out for the latest major. A sunset major runs on the latest major and the response says `rerouted`.
    SourceRunRequest:
      description: Do not combine `expected_version` and `definition_version`, including a null value.
      allOf:
        - $ref: '#/components/schemas/RunOptions'
        - type: object
          properties:
            input:
              type: object
              additionalProperties: true
              description: Inputs accepted by the source's generated contract.
            expected_version:
              type: string
              pattern: '^[a-f0-9]{64}$'
              description: Require the active definition to match this version.
            definition_version:
              type: string
              pattern: '^[a-f0-9]{64}$'
              description: Select an accepted immutable revision explicitly.
            endpoint:
              type: string
              description: Optional; the supported value is `search`.
    RunProgress:
      type: object
      properties:
        pages:
          type: integer
        commits:
          type: integer
        items:
          type: integer
          description: Committed records.
        duplicates:
          type: integer
          description: Repeated records dropped.
    RunLinks:
      type: object
      properties:
        self:
          type: string
        items:
          type: string
        result:
          type: string
        abort:
          type: string
    Run:
      type: object
      description: The run object.
      properties:
        run_id:
          type: string
        surface:
          type: string
          description: How the run was started (`rest_run`, `rest_stream`, `async_run`, `mcp_call`).
        source_id:
          type: string
        definition_version:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        stop_reason:
          type: [string, 'null']
          description: |
            Why the run ended; null while it runs. Known values: `source_exhausted`, `scope_end`, `series_unfilled`,
            `end_not_confirmed`, `max_items`, `timeout`, `budget_exhausted`, `aborted`, `blocked`, `error`. Treat an
            unknown value as an ended run and keep it.
        created_at:
          type: [string, 'null']
        started_at:
          type: [string, 'null']
        finished_at:
          type: [string, 'null']
        limits:
          type: object
          additionalProperties: true
          properties:
            max_items:
              type: [integer, 'null']
            timeout_seconds:
              type: integer
        progress:
          $ref: '#/components/schemas/RunProgress'
        units_charged:
          type: number
        abort_requested:
          type: boolean
        error:
          type: object
          description: 'On failure: `code`, `status`, `detail` and an optional `retry_after`.'
          additionalProperties: true
        connection_id:
          type: string
        session:
          type: string
        poll_after_seconds:
          type: number
          description: Present while the run is queued or running.
        links:
          $ref: '#/components/schemas/RunLinks'
        version:
          type: string
          description: 'The version that ran, on a catalog run: the major and its newest minor.'
        version_requested:
          type: integer
        rerouted:
          type: string
          enum: [sunset]
      required: [run_id, status]
    RunList:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_cursor:
          type: [string, 'null']
      required: [runs]
    RunItemsPage:
      type: object
      properties:
        run_id:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        count:
          type: integer
          description: The number of records in this page.
        next_cursor:
          type: [string, 'null']
          description: The cursor for the next page. Null once the run ended and every record was read.
        run_status:
          $ref: '#/components/schemas/RunStatus'
      required: [run_id, items, count, next_cursor, run_status]
    Summary:
      type: object
      additionalProperties: true
      properties:
        source_id:
          type: string
        definition_version:
          type: string
        status:
          type: string
          enum: [completed, bounded, partial]
          description: '`completed` and `bounded` with `within_scope_passed` true are usable. `bounded` and `partial` mean the source can hold more records.'
        within_scope_passed:
          type: boolean
        catalog_complete:
          type: boolean
          description: A run does not establish full-catalog coverage; the generated contract reports `false`.
        records:
          type: integer
    Delivery:
      type: object
      description: Present for a customer workspace run.
      properties:
        runId:
          type: string
        chargeReceiptId:
          type: string
          description: The same identifier as `runId`.
        recordCount:
          type: integer
    RunResult:
      type: object
      description: A run that ended. Check `summary.status` is `completed` or `bounded` and `summary.within_scope_passed` is true before you use the records.
      properties:
        records:
          type: array
          items:
            type: object
            additionalProperties: true
        summary:
          $ref: '#/components/schemas/Summary'
        metadata:
          type: object
          additionalProperties: true
          properties:
            definition_version:
              type: string
        artifacts:
          type: array
          items:
            type: object
            additionalProperties: true
        traceId:
          type: [string, 'null']
        run:
          $ref: '#/components/schemas/Run'
        delivery:
          $ref: '#/components/schemas/Delivery'
        version:
          type: string
        version_requested:
          type: integer
        rerouted:
          type: string
          enum: [sunset]
      required: [records, summary, run]
    SourceRunDetail:
      type: object
      properties:
        contract_version:
          type: string
          examples:
            - builder-run-detail-v1
        run:
          type: object
          additionalProperties: true
        results:
          type: object
          additionalProperties: true
          description: '`state` is one of `available`, `executing`, `pending_settlement`, `failed`, `not_retained`, `unavailable`.'
        billing:
          type: object
          additionalProperties: true
        recovery:
          type: object
          additionalProperties: true
      required: [run, results, billing]
    SourceVersionList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              source_id:
                type: string
              version:
                type: string
              status:
                type: string
                enum: [active, previously_activated, inactive_candidate, activation_unknown]
              created_at:
                type: number
              jobs:
                type: array
                items:
                  type: object
                  additionalProperties: true
        next_cursor:
          type: [string, 'null']
        consistency:
          type: string
      required: [items]
    SourceVersionContract:
      type: object
      additionalProperties: true
      properties:
        schema_version:
          type: integer
        source_id:
          type: string
        definition_version:
          type: string
        output_version:
          type: string
        limits:
          type: object
          additionalProperties: true
        openapi:
          type: object
          description: An OpenAPI document for this version's run request and records.
          additionalProperties: true
        request:
          type: object
          additionalProperties: true
          properties:
            method:
              type: string
            path:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              type: object
              additionalProperties: true
      required: [source_id, definition_version, openapi, request]
    SourceConnection:
      type: object
      additionalProperties: true
      properties:
        source_id:
          type: string
        definition_version:
          type: string
        rest:
          type: object
          properties:
            method:
              type: string
              enum: [POST]
            path:
              type: string
              description: A path, never an origin.
            body:
              type: object
              additionalProperties: true
            headers:
              type: object
              properties:
                Idempotency-Key:
                  type: string
            curl:
              type: string
        mcp:
          type: object
          additionalProperties: true
        authentication:
          type: string
        idempotency:
          type: object
          additionalProperties: true
      required: [source_id, definition_version, rest]
    ApiHealth:
      type: object
      additionalProperties: true
      properties:
        source_id:
          type: string
        definition_version:
          type: string
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown, stale, never_checked]
        checked_at:
          type: [number, 'null']
        fresh_until:
          type: [number, 'null']
        monitoring_overdue:
          type: boolean
        records_observed:
          type: [integer, 'null']
        monitoring_due_at:
          type: [number, 'null']
          description: When the next monitoring check is due (Unix seconds).
        environment:
          type: string
          description: Where the checks ran, for example `production`.
        coverage:
          type: string
          description: How much the checks cover, for example `bounded_sample`.
        semantic_status:
          type: string
          description: Whether the records were also checked for meaning, for example `unqualified`.
        case_coverage:
          type: object
          additionalProperties: true
          description: Counts of the monitored input cases (`total`, `checked`, `current`, `healthy`, `overdue`) and a `state`.
        monitored_case:
          type: [object, 'null']
          additionalProperties: true
        sampled_scope:
          type: [object, 'null']
          additionalProperties: true
        incident:
          type: [object, 'null']
          additionalProperties: true
          description: The open incident, if any.
        incidents:
          type: array
          items:
            type: object
            additionalProperties: true
        evidence:
          type: object
          additionalProperties: true
      required: [source_id, definition_version, status, evidence]
    Cadence:
      type: object
      properties:
        every:
          type: string
          enum: [hour, day, week]
        at_utc:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: UTC time of day, `HH:MM` (for `hour`, the minute past each hour). Default `00:00`.
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: For `week`, the day, 0 Monday to 6 Sunday. Default Monday.
      required: [every]
    ScheduleCreate:
      type: object
      description: Give `api_id` and `endpoint_id` (a catalog API), or `source_id` (one of your own); not both.
      additionalProperties: false
      properties:
        api_id:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        endpoint_id:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        source_id:
          type: string
        version:
          type: integer
          minimum: 1
          description: The major of a catalog API to schedule; default the listing's current one.
        input:
          type: object
          additionalProperties: true
          description: The API's inputs. Every required input is given now; each slot runs with them.
        fields:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        max_items:
          type: integer
          minimum: 1
        timeout_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 10800
        every:
          type: string
          enum: [hour, day, week]
        at_utc:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        run_now:
          type: boolean
          description: Also run once at the next tick, not only from the next slot.
        name:
          type: string
          minLength: 1
          maxLength: 200
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Required unless sent as the `Idempotency-Key` header.
      required: [every]
    Schedule:
      type: object
      additionalProperties: true
      properties:
        schedule_id:
          type: string
        name:
          type: [string, 'null']
        state:
          type: string
          enum: [active, paused]
        pause_reason:
          type: [string, 'null']
          description: For example `paused_by_customer`, `key_revoked`, `insufficient_units`, `consecutive_failures`, `version_changed`.
        target:
          type: object
          description: '`api_id` and `endpoint_id`, or `source_id`.'
          additionalProperties: true
        source_id:
          type: [string, 'null']
        pinned_version:
          type: [string, 'null']
        input:
          type: object
          additionalProperties: true
        fields:
          type: [array, 'null']
          items:
            type: string
        max_items:
          type: [integer, 'null']
        timeout_seconds:
          type: integer
        cadence:
          $ref: '#/components/schemas/Cadence'
        next_due_at:
          type: [string, 'null']
        last_slot_at:
          type: [string, 'null']
        last_run_id:
          type: [string, 'null']
        last_status:
          type: [string, 'null']
        consecutive_failures:
          type: integer
        skipped_slots:
          type: integer
        last_skip_reason:
          type: [string, 'null']
        consecutive_skips:
          type: integer
        deferred_reason:
          type: [string, 'null']
        last_deferred_at:
          type: [string, 'null']
        attention:
          type: array
          items:
            type: string
            enum: [deferred, overdue, previous_run_stuck]
        created_at:
          type: string
        version:
          type: integer
          description: For a catalog schedule, the major version of the API it is pinned to.
        last_run_rerouted:
          type: [string, 'null']
          description: Why the last run did not use the pinned major version (for example `sunset`), or null.
        paused_at:
          type: string
        inflight_run_id:
          type: [string, 'null']
          description: On a pause answer, the run a ticker was already starting.
        replayed:
          type: boolean
      required: [schedule_id, state, cadence]
    ScheduleList:
      type: object
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
        limit:
          type: integer
          description: The most schedules a workspace holds.
      required: [schedules]
    ScheduleDeleted:
      type: object
      properties:
        schedule_id:
          type: string
        deleted:
          type: boolean
        inflight_run_id:
          type: [string, 'null']
      required: [schedule_id, deleted]
