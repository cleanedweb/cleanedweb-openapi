  /v1/schedules:
    post:
      operationId: createSchedule
      tags: [Schedules]
      summary: Create a schedule
      description: |
        Runs a catalog endpoint (`api_id` and `endpoint_id`) or one of your sources (`source_id`) at a cadence of every
        hour, day or week (UTC, at most once an hour). Each due slot starts an ordinary charged run. The creating key
        stands behind it and must keep the `run` scope. A workspace holds at most 50 schedules.

        The retry key is the `Idempotency-Key` header or the body's `idempotency_key`; send one. The same key and
        arguments answer the same schedule (`200`, `Idempotent-Replayed: true`) and never create a second; another
        request under the same key answers `409` `schedule_idempotency_conflict`. A deleted schedule is never revived.
        Not described in the public docs, whose scheduling guide says there is no native endpoint.
      x-scopes-any-of: [run]
      x-idempotent: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: The retry key. Send it here or as `idempotency_key` in the body; if both are present they must match.
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
            example:
              api_id: generated_047a8ebb25911ccf62f4a212
              endpoint_id: generated_047a8ebb25911ccf62f4a212_search
              input: {}
              max_items: 100
              every: day
              at_utc: '06:30'
              name: Daily GitHub topics
              idempotency_key: daily-github-topics-1
      responses:
        '200':
          description: The key already made this schedule.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '201':
          description: The schedule was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
