openapi: 3.1.0
info:
  title: CleanedWeb public API
  version: 0.1.0
  summary: Run maintained web data APIs, read their records and recover safely.
  description: |
    CleanedWeb turns collections of public websites into maintained REST APIs. This document describes
    the customer-facing surface only: the published catalog, runs, schedules and the source APIs of your
    own workspace. Builder, admin, control and pipeline routes are not part of it.

    **Pre-release.** The document may change before the first SDK release. See `FINDINGS.md` for every
    place where the documentation, the engine and the live service disagree.

    ## Origins

    | Origin | Serves |
    | --- | --- |
    | `https://api.cleanedweb.com` | Every `/v1/` route below: catalog reads, runs, results, schedules and source APIs. This is the one origin an SDK needs. |
    | `https://app.cleanedweb.com` | The console's no-key catalog reads under `/api/catalog/`. Same data as the catalog routes on the API origin. |
    | `https://cleanedweb.com` | Static machine files of the catalog site (`/catalog/index.json`, `/catalog/{slug}/contract.json`). |

    `https://broker.cleanedweb.com` is the acquisition broker, not the customer API. It has no `/v1/runs` or
    `/v1/catalog/public` routes and refuses scoped customer keys (see `FINDINGS.md`, finding 1).

    ## Authentication and scopes

    Send an account API key as `Authorization: Bearer <key>`. A key has scopes:

    | Scope | Permits |
    | --- | --- |
    | `read` | Source connection details, versions and contracts, schedules (list, get), catalog result recovery and filters. |
    | `run` | Start runs, read runs, items and abort, create, pause, resume and delete schedules, read a catalog run's result by key. |
    | `results` | Read run results (`/v1/runs/{run_id}/result`, `/v1/sources/{source_id}/runs/{run_id}`) and run lists. |

    Each operation lists the scopes that open it in `x-scopes-any-of`. A key without the scope answers `403`.
    Catalog reads (list, get, contract) need no key.

    ## Idempotency and runs

    Every run needs an `Idempotency-Key` (1 to 200 characters: letters, numbers, `.`, `_`, `:`, `-`). Save the
    key before you send. The same key and request returns the same run: `202` while it runs, the final body
    when it ended, the saved error when it failed (for seven days). Never send the POST again to wait: read
    the result with the same key. A failed run is final for its key; use a new key to run again.

    ## Errors

    Every error body is `{"detail": ...}`. `detail` is a string, an object with a `code`, or a list of
    validation issues. An error that marks a failed run carries `run_id`, `error_code`
    (`run_failed` or `failed_run_replayed`) and `replayed` in `detail`, plus a `Location` header. An error
    without that marker (a timeout, a gateway error, a `503`) does not show whether the run failed: keep the
    key and read the result.
  termsOfService: https://cleanedweb.com/legal/terms/
  contact:
    name: CleanedWeb
    url: https://cleanedweb.com/contact/?utm_source=github&utm_medium=cleanedweb-openapi
  license:
    name: MIT
    identifier: MIT
  x-private-preview: true
servers:
  - url: https://api.cleanedweb.com
    description: CleanedWeb API (catalog, runs, schedules, source APIs)
tags:
  - name: Catalog
    description: Published APIs. Reading needs no key.
  - name: Catalog runs
    description: Run a published API and read its result.
  - name: Runs
    description: Read, list and abort any run you started.
  - name: Source APIs
    description: The private APIs of your own workspace.
  - name: Schedules
    description: Recurring catalog or source runs.
  - name: Catalog site
    description: Static machine files of the catalog site, no key.
security:
  - bearerAuth: []
paths:
  /v1/catalog/public/apis:
    get:
      operationId: listCatalogApis
      tags: [Catalog]
      summary: List published APIs
      description: |
        The published catalog, newest first. Needs no key. Offset paging reflects current content and is not a
        snapshot across requests. The same list is served by `GET /api/catalog/apis` on the app origin.
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: One page of published APIs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogApiList'
              example:
                items:
                  - api_id: generated_047a8ebb25911ccf62f4a212
                    name: GitHub Topics Repositories
                    short_description: Public GitHub repositories listed under a topic, with name, description, owner, stars and forks.
                    category: uncategorized
                    record_types: []
                    countries: []
                    languages: []
                    tags: []
                    limitations: []
                    site:
                      name: GitHub Topics Repositories
                      domain: github.com
                    endpoints:
                      - endpoint_id: generated_047a8ebb25911ccf62f4a212_search
                        name: Extract records
                        description: Return records within the accepted scope.
                        status: available
                        acquisition: http
                    health: unknown
                    last_verified_at: null
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/catalog/public/apis/{api_id}:
    get:
      operationId: getCatalogApi
      tags: [Catalog]
      summary: Get one published API
      description: Adds each endpoint's `active_version`, `version`, `versions` and `changelog`. Needs no key.
      security: []
      parameters:
        - $ref: '#/components/parameters/ApiId'
      responses:
        '200':
          description: The API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogApi'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/catalog/public/apis/{api_id}/endpoints/{endpoint_id}/contract:
    get:
      operationId: getCatalogEndpointContract
      tags: [Catalog]
      summary: Read an endpoint's contract
      description: |
        The contract is generated from the exact saved definition that runs: `input_schema`, `output_schema`,
        saved samples and the run request (`method`, `path`). Pass `version` to read a pinned major. Needs no key.
      security: []
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/EndpointId'
        - $ref: '#/components/parameters/ContractVersion'
      responses:
        '200':
          description: The contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/catalog/public/apis/{api_id}/endpoints/{endpoint_id}/filters:
    get:
      operationId: describeCatalogEndpointFilters
      tags: [Catalog]
      summary: Describe an endpoint's category filters
      description: |
        For an endpoint that takes category `filters`: one live page read of the category vocabulary. Free (no
        Units, nothing runs). `502` means the site did not serve the category page; retry. An endpoint without
        category filters answers `404` with `category_filters_unavailable`, in a different envelope from every other
        error: `{"error": {"code", "message", "details"}}` instead of `{"detail": ...}` (`FINDINGS.md`, finding 12).
        Not described in the public docs.
      x-scopes-any-of: [run, read]
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/EndpointId'
        - name: category
          in: query
          required: false
          description: A category from an earlier describe.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Words for what you want; alone, it suggests categories.
          schema:
            type: string
        - name: filters
          in: query
          required: false
          description: 'A JSON object text, such as `{"brand":"Leica"}`.'
          schema:
            type: string
      responses:
        '200':
          description: Categories and filters with their allowed values.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/catalog/public/apis/{api_id}/endpoints/{endpoint_id}/run:
    post:
      operationId: runCatalogEndpoint
      tags: [Catalog runs]
      summary: Run a catalog endpoint
      description: |
        Runs the endpoint's latest major, or the major the body pins with `version`. A run uses the Units of your
        workspace: one per saved record, charged as pages are committed. You cannot choose the source or the owner.
        Start with a small `max_items`.

        `200` when the run ended within `wait_seconds` (default 90), `202` while it goes on. On `202` do not send the
        POST again: read `getCatalogEndpointResult` with the same key after `Retry-After` seconds.
      x-scopes-any-of: [run]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/EndpointId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRunRequest'
            example:
              input:
                sort: desc_stars
              max_items: 25
              timeout_seconds: 3600
              wait_seconds: 90
      responses:
        '200':
          description: The run ended within `wait_seconds`, or its result is final.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
              example:
                records:
                  - title: web-scraping-google-sheets
                    url: https://github.com/oxylabs/web-scraping-google-sheets
                    description: Guide to Using Google Sheets for Basic Web Scraping
                summary:
                  source_id: generated_047a8ebb25911ccf62f4a212_search
                  definition_version: eec683b95f337dcc63a3fb5bf1e23729fb71f6f719f51ea771c19345b5893252
                  status: bounded
                  within_scope_passed: true
                  catalog_complete: false
                  records: 1
                metadata:
                  definition_version: eec683b95f337dcc63a3fb5bf1e23729fb71f6f719f51ea771c19345b5893252
                artifacts: []
                traceId: null
                run:
                  run_id: 0123456789abcdef0123456789abcdef
                  status: finished
                  stop_reason: max_items
                  units_charged: 1
                delivery:
                  runId: 0123456789abcdef0123456789abcdef
                  chargeReceiptId: 0123456789abcdef0123456789abcdef
                  recordCount: 1
        '202':
          $ref: '#/components/responses/RunAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/catalog/public/apis/{api_id}/endpoints/{endpoint_id}/result:
    get:
      operationId: getCatalogEndpointResult
      tags: [Catalog runs]
      summary: Read a catalog run's result by its idempotency key
      description: |
        Finds the run a catalog request started by its `Idempotency-Key` and answers as the run did: `202` with the
        run object while it goes on, `200` with the final body when it ended, or the run's error. Never collects the
        website again. Works after the API is unpublished or its version changes. A key unknown for the endpoint
        answers `404` (`catalog_delivery_not_found`); a key reused for another endpoint or version answers `409`
        (`delivery_identity_conflict`).
      x-scopes-any-of: [run, read]
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/EndpointId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Nulls'
      responses:
        '200':
          description: The run ended.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '202':
          $ref: '#/components/responses/RunAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/runs:
    get:
      operationId: listRuns
      tags: [Runs]
      summary: List your runs
      description: Your runs, newest first. Pass `next_cursor` as `cursor` to read the next page. An unknown or repeated query parameter answers `422` with `run_list_query_invalid`.
      x-scopes-any-of: [run, results]
      parameters:
        - name: source_id
          in: query
          required: false
          description: Only runs of this source or catalog endpoint source.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: cursor
          in: query
          required: false
          description: The opaque `next_cursor` of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      tags: [Runs]
      summary: Read a run
      description: The run object. Reading a run never collects the website again. A foreign or missing run answers `404`.
      x-scopes-any-of: [run, results]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/runs/{run_id}/items:
    get:
      operationId: listRunItems
      tags: [Runs]
      summary: Read the records committed so far
      description: |
        Items `[cursor, cursor + limit)`, readable while the run runs. `next_cursor` is null once the run ended and
        every record was read. With `format=jsonl` each line is one record, and the answer carries `X-Run-Status` and,
        while more can follow, `X-Next-Cursor` headers (the json format carries them too).
      x-scopes-any-of: [run, results]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: cursor
          in: query
          required: false
          description: Position of the first record to read. Starts at `0`. Pass the returned `next_cursor` to continue.
          schema:
            type: string
            pattern: '^[0-9]+$'
            default: '0'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, jsonl]
            default: json
        - $ref: '#/components/parameters/Nulls'
      responses:
        '200':
          description: One page of records.
          headers:
            X-Run-Status:
              $ref: '#/components/headers/XRunStatus'
            X-Next-Cursor:
              $ref: '#/components/headers/XNextCursor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunItemsPage'
              example:
                run_id: 0123456789abcdef0123456789abcdef
                items:
                  - title: creeper
                    url: https://github.com/z7r1k3/creeper
                count: 1
                next_cursor: '1'
                run_status: running
            application/x-ndjson:
              schema:
                type: string
                description: One JSON record per line.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/runs/{run_id}/result:
    get:
      operationId: getRunResult
      tags: [Runs]
      summary: Read a run's result
      description: |
        `200` with the final body once the run ended, `202` with the run object while it goes on (header
        `Retry-After`), or the run's error (a failed run carries the failed-run marker). Reading a result never
        collects the website again.

        Needs the `run` or `results` scope (`FINDINGS.md`, finding 2).
      x-scopes-any-of: [run, results]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Nulls'
      responses:
        '200':
          description: The run ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '202':
          $ref: '#/components/responses/RunAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/runs/{run_id}/abort:
    post:
      operationId: abortRun
      tags: [Runs]
      summary: Abort a run
      description: '`202` with the run object while it stops, `200` if it had already ended. Records committed so far stay readable and charged.'
      x-scopes-any-of: [run]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run had already ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '202':
          description: The run is stopping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/sources/{source_id}/run:
    post:
      operationId: runSource
      tags: [Source APIs]
      summary: Run one of your source APIs
      description: |
        Executes an accepted source definition. A run that ends within `wait_seconds` (default 90) answers `200` with
        its records; a longer run answers `202` with the run object: read `getRunResult` (`links.result`) after
        `Retry-After` seconds. There is no keyed result route for source runs.

        Send `expected_version` (the full 64-character definition version) to guard against a changed definition, or
        `definition_version` to select an accepted revision. Do not send both.

        Use the origin from your source's connection details. Today that is `https://api.cleanedweb.com`.
      x-scopes-any-of: [run]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRunRequest'
            example:
              expected_version: eec683b95f337dcc63a3fb5bf1e23729fb71f6f719f51ea771c19345b5893252
              input: {}
              max_items: 25
      responses:
        '200':
          description: The run ended within `wait_seconds`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '202':
          $ref: '#/components/responses/RunAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/sources/{source_id}/runs:
    post:
      operationId: startSourceRun
      tags: [Source APIs]
      summary: Start a source run without waiting
      description: |
        Takes the same headers and body as `runSource`, with `wait_seconds` defaulting to `0`. Answers with the run
        object and a `Location` header: usually `202`, or `200` when the run already ended (a failed run included). A
        replayed key adds `Idempotent-Replayed: true`. Background runs share one queue lane; `/run`, `/stream` and MCP
        calls share another.
      x-scopes-any-of: [run]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - name: Idempotency-Key
          in: header
          required: false
          description: Required for a customer workspace run (it answers `422` `idempotency_key_required` without one). Send it on every call so a lost response can be recovered.
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRunRequest'
      responses:
        '200':
          description: The run already ended; the body is the run object, not the records.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '202':
          description: The run is queued or running.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/sources/{source_id}/stream:
    post:
      operationId: streamSourceRun
      tags: [Source APIs]
      summary: Stream a source run's records
      description: |
        Takes the same headers and body as `runSource` and answers newline-delimited JSON; every line has an
        increasing `sequence`. First line `progress` (stage `running`, with the run), then `records` lines as pages are
        committed, a `progress` heartbeat after 10 seconds without records, and a final `done` or `error` line. The
        stream has no fixed time limit. Closing it leaves the run running; read it with `getRun`.
      x-scopes-any-of: [run]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRunRequest'
      responses:
        '200':
          description: The event stream. A failed run ends it with an `error` line, not an HTTP error status.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One `StreamEvent` JSON object per line.
              example: |
                {"type":"progress","stage":"running","run":{"run_id":"0123456789abcdef0123456789abcdef","status":"running"},"sequence":1}
                {"type":"records","records":[{"title":"creeper"}],"definition_version":"eec683b9","sequence":2}
                {"type":"done","summary":{"status":"completed"},"elapsedMs":4200,"sequence":3}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
