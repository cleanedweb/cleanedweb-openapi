name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Lint the spec
        run: npx --yes @redocly/cli@2 lint openapi.yaml
      - name: Install the check scripts' dependencies
        run: pip install -r requirements.txt
      - name: Validate the conformance cases against the spec
        run: python scripts/validate_conformance.py
      - name: Drift check against the saved snapshot (offline)
        run: python scripts/check_drift.py --live-file tests/fixtures/engine-curated-routes.json
