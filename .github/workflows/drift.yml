name: drift
# Compares openapi.yaml with the live document of api.cleanedweb.com. It fails when a curated route
# disappears, when the live document declares a query parameter we lack, or (strict) when a new live
# route is neither curated nor listed as internal. Not required to pass offline.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/check_drift.py --strict
